name: Coding Standards

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  phpcs:
    name: PHP CodeSniffer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Assert PHPCS is actually installed
        run: |
          # The "Run PHPCS" step below used to be wrapped in
          # `if [ -f vendor/bin/phpcs ]`. That binary DOES currently exist
          # (squizlabs/php_codesniffer is in composer.json require-dev), so unlike
          # the Psalm and Security Audit jobs this gate is genuinely running today.
          #
          # It is still the same fragile shape: the moment the dependency were
          # dropped, or `composer install` produced a partial vendor/, the guard
          # would go false and this job would report GREEN having sniffed zero
          # files — silently, with nothing in the log to say so. That is exactly
          # how S146's Psalm job and this file's Security Audit job spent their
          # whole lives green while checking nothing. Converted to an assertion so
          # a missing tool FAILS instead of skipping.
          if [ ! -f vendor/bin/phpcs ]; then
            echo "::error::vendor/bin/phpcs is missing. squizlabs/php_codesniffer must stay in composer.json require-dev — do not re-add an 'if [ -f ... ]' guard around the analysis step (S146)."
            exit 1
          fi
          ./vendor/bin/phpcs --version

      - name: Run PHPCS
        # S109. This used to pass `-n`, which suppresses WARNINGS entirely. That
        # is how S100's PSR-12 regression reached review: the gate was green
        # while 8 warnings across 7 files sat in src/ unreported. All 8 (every
        # one a `Generic.Files.LineLength` over-120) were reflowed in the same
        # commit that removed this flag, because removing it first would have
        # turned master red. Do NOT re-add `-n`, and do not silence a finding
        # with an inline `phpcs:ignore` — reflow the line instead.
        #
        # Scope note: this gate covers `src/` only, and `tests/` is now covered by
        # the separate step below (S128). `scripts/`, `bin/`, `migrations/`,
        # `public/` and `config/` are still unsniffed for errors as well as
        # warnings. Widening to those is a separate atomic change with its own
        # baseline to reflow first.
        run: ./vendor/bin/phpcs --standard=PSR12 --colors src/

      - name: Run PHPCS on tests/
        # S128 — ADDITIVE. Before this, `tests/` was sniffed by nothing: the step
        # above passes `src/` explicitly and the `test-server` job in
        # phpunit.yml passes `src/Server/`. Two brand-new 451- and 358-line test
        # files reached master through every gate without phpcs ever opening them.
        #
        # The standard is `phpcs-tests.xml`, NOT PSR12 — read that file's
        # <description> for the measurement (2155 errors) and for why exactly two
        # sniffs are excluded. src/ keeps unmodified PSR-12; nothing here relaxes it.
        #
        # ⚠ Do NOT add `-n` and do NOT add `|| true`. Warnings are non-blocking via
        # `ignore_warnings_on_exit` INSIDE the ruleset, which still finds, counts
        # and prints every one of them; `-n` would delete them from the report,
        # which is exactly the S109 defect. Judge this step by the
        # "A TOTAL OF n ERRORS AND m WARNINGS" line in the log.
        run: ./vendor/bin/phpcs --standard=phpcs-tests.xml --colors

  phpstan:
    name: PHPStan Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Assert no phpstan baseline file
        run: |
          if [ -f phpstan-baseline.neon ]; then
            echo "::error::phpstan-baseline.neon has been re-introduced. Wave 5 deleted it permanently — fix errors at their source, do not regenerate a baseline."
            exit 1
          fi

      - name: Assert PHPStan is actually installed
        run: |
          # Same conversion as the PHPCS job. `phpstan/phpstan` is in composer.json
          # require-dev so `vendor/bin/phpstan` exists today and this gate really
          # runs — but `if [ -f vendor/bin/phpstan ]` would turn a dropped
          # dependency into a silent pass rather than a failure, which is the
          # defect S146 was raised for and the one the Security Audit job in this
          # same file had been living with since the first CI commit.
          if [ ! -f vendor/bin/phpstan ]; then
            echo "::error::vendor/bin/phpstan is missing. phpstan/phpstan must stay in composer.json require-dev — do not re-add an 'if [ -f ... ]' guard around the analysis step (S146)."
            exit 1
          fi
          ./vendor/bin/phpstan --version

      - name: Run PHPStan
        # ⚠ The `src/` and `--level=9` on this command line OVERRIDE
        # `phpstan.neon`'s `paths` and `level`. That is not a style choice, it is a
        # trap worth knowing about: S128 was originally written as "phpstan.neon has
        # paths: [src], so add tests" — and doing only that would have changed local
        # runs while leaving THIS step analysing exactly `src/`, with a green gate and
        # a config file that lied about its own scope. Any change to what PHPStan
        # reads has to happen HERE as well as in a config.
        run: ./vendor/bin/phpstan analyze src/ --level=9 --no-progress --error-format=github

      - name: Run PHPStan on tests/
        # S128 — ADDITIVE, and deliberately a SECOND config rather than more paths in
        # the first one. `phpstan-tests.neon` pins `tests/` at level 2 with no
        # baseline; `phpstan.neon` keeps `src/` at level 9 with no baseline. Merging
        # them would force one level on both trees, and the measured fallout for
        # tests/ at level 9 is 532 errors.
        #
        # No `--level` and no path here ON PURPOSE: both come from the config, so the
        # level cannot drift between this file and that one. Read
        # phpstan-tests.neon's header for the full measured ladder (levels 0-9) and
        # for what raising it to level 4 would catch.
        run: ./vendor/bin/phpstan analyse -c phpstan-tests.neon --no-progress --error-format=github

  smarty-escape-guard:
    name: Smarty Page-Rendering Guard (S1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Assert Smarty is never reintroduced for browser-facing HTML
        run: |
          # S1 (rewritten). This guard originally required exactly ONE
          # `new \Smarty()` in src/Server/WebPortal — the PageRenderer factory
          # that set escape_html = true so portal HTML could not be XSS'd.
          #
          # Smarty page rendering has since been retired: PageRenderer and the
          # page templates are gone, WebPortalRouter serves JSON only, and the
          # /app Vue SPA is the whole web UI. The old assertion could therefore
          # never pass again (it demanded an instance in a deleted file), which
          # is why it broke the build.
          #
          # The escaping RISK it guarded is what matters, so invert it: Smarty
          # must stay out of the browser-facing path entirely. The single
          # legitimate remaining use is the newsletter EMAIL template
          # (src/Admin/NewsletterGenerator.php) — a mail body, not a page served
          # to a browser session.
          browser_facing="$(grep -rnE '=\s*new\s+\\?Smarty\s*\(' src/Server/ || true)"
          if [ -n "$browser_facing" ]; then
            echo "::error::Smarty instantiated under src/Server (browser-facing). Page rendering is retired — the /app SPA is the web UI. Do not reintroduce server-rendered Smarty HTML:"
            echo "$browser_facing"
            exit 1
          fi

          # Wherever Smarty IS still used, auto-escaping must not be turned off.
          if grep -rnE "escape_html\s*=\s*false|setEscapeHtml\s*\(\s*false" src/; then
            echo "::error::HTML auto-escape is being disabled for a Smarty instance. escape_html must not be set false (S1)."
            exit 1
          fi

          echo "Remaining (allowed, non-browser-facing) Smarty use:"
          grep -rnE '=\s*new\s+\\?Smarty\s*\(' src/ || echo "  <none>"
          echo "Smarty page-rendering guard passed."

  psalm:
    name: Psalm Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # S146. This job used to declare `extensions: json` only. Psalm resolves
          # classes and constants from the extensions that are actually LOADED, so
          # without these it reports 140 phantom errors that are missing-extension
          # artifacts rather than code defects — measured on this tree:
          #   Swoole\Coroutine\Channel x34, Swoole\Coroutine x23, Socket x15,
          #   Swoole\Coroutine\Socket x6, ZipArchive x3, GdImage x3,
          #   Swoole\Coroutine\Http\Client x1, FFI x1, plus AF_INET/SOL_SOCKET/
          #   SOCK_DGRAM/SO_RCVTIMEO/SO_SNDTIMEO/SOL_UDP constants.
          # A gate that is red for reasons unrelated to the code gets switched off,
          # which is exactly how the old no-op guard below came to exist.
          #
          # Base list copied from the canonical project list in phpunit.yml (the
          # `test:` job, `mysql, pdo, pdo_mysql, json, gd, zip, fileinfo, swoole`)
          # minus pcov, which is coverage-only. Added for static analysis:
          # sockets + pcntl + posix (Discovery/Mdns, ProcessManager), ldap (the
          # LDAP auth plugin), ffi (ChromaPrintFfi) and curl.
          extensions: mysql, pdo, pdo_mysql, json, gd, zip, fileinfo, swoole, sockets, pcntl, posix, ldap, ffi, curl

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Assert Psalm is actually installed
        run: |
          # S146. The "Run Psalm" step below used to be wrapped in
          # `if [ -f vendor/bin/psalm ]`, and `vimeo/psalm` was never in
          # composer.json — so the binary never existed, the condition was always
          # false, and this job reported GREEN having analysed zero files. It was
          # counted as real coverage in PR reviews. The guard is gone; this
          # assertion replaces it so that a *missing tool* fails loudly instead of
          # silently degrading back into a no-op.
          if [ ! -f vendor/bin/psalm ]; then
            echo "::error::vendor/bin/psalm is missing. vimeo/psalm must stay in composer.json require-dev — do not re-add an 'if [ -f ... ]' guard around the analysis step (S146)."
            exit 1
          fi
          ./vendor/bin/psalm --version

      - name: Assert no psalm baseline file
        run: |
          # Mirrors the PHPStan job's baseline assertion. A baseline would make
          # this gate green while proving nothing, reproducing the exact defect
          # S146 exists to remove. Fix findings at their source or lower the
          # errorLevel in psalm.xml with a written rationale.
          if [ -f psalm-baseline.xml ]; then
            echo "::error::psalm-baseline.xml has been introduced. S146 forbids it — a baseline reproduces the permanently-green gate this job was fixed to stop being."
            exit 1
          fi

      - name: Run Psalm
        if: always()
        run: ./vendor/bin/psalm --show-info=false --no-progress

  composer-validate:
    name: Composer Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Validate Composer
        run: composer validate --strict --no-check-publish

  security-check:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      # NOTE: there is deliberately no `composer install` in this job any more.
      # The audit runs against composer.lock (`--locked`) and needs no vendor/ at
      # all, and Composer 2.10 refuses to INSTALL packages carrying known
      # advisories (policy.advisories.block) — so auditing after an install would
      # mean a vulnerable lock died in the dependency solver with an opaque
      # resolution error before this job's audit ever ran. Auditing the lock
      # first produces the precise, actionable report instead.

      - name: Assert the security audit tool is actually available
        run: |
          # THE DEFECT THIS REPLACES. The "Run Security Audit" step used to be:
          #
          #   if [ -f vendor/bin/security-checker ]; then
          #     ./vendor/bin/security-checker security:check
          #   elif [ -f vendor/bin/composer-audit ]; then
          #     ./vendor/bin/composer-audit audit --format=github
          #   fi
          #
          # NEITHER binary has ever existed. sensiolabs/security-checker (which is
          # also abandoned upstream) and any package shipping a `composer-audit`
          # binary are both absent from composer.json — vendor/bin/ holds phpcs,
          # phpstan and psalm and neither of these. Both branches were always
          # false, the `if` fell through, the step exited 0, and this job reported
          # GREEN having audited nothing, for the entire life of the repo.
          #
          # Same defect class as S146 (the Psalm job that spent its life green
          # having analysed zero files), so this mirrors its assertion: a missing
          # tool must FAIL LOUDLY, never silently skip.
          #
          # The tool is now `composer audit`, built into Composer 2.4+. There is
          # no vendor/bin/ binary to probe for and nothing to add to composer.json.
          if ! command -v composer >/dev/null 2>&1; then
            echo "::error::composer is not on PATH, so the security audit cannot run. Do NOT re-add an 'if [ -f ... ]' guard that turns a missing tool into a silent pass (S146)."
            exit 1
          fi
          composer --version
          if ! composer audit --help >/dev/null 2>&1; then
            echo "::error::This composer has no 'audit' command (it was added in Composer 2.4). Pin a v2 composer in the setup-php step: tools: composer:v2."
            exit 1
          fi

      - name: Run Security Audit
        # Blocking on advisories, loudly advisory on abandoned packages. The split
        # is enforced in the script because `composer audit`'s exit code conflates
        # the two: measured on this tree it exits 1 with ZERO advisories, purely
        # because fgrosse/phpasn1 and web-auth/metadata-service are abandoned
        # transitive dependencies that cannot be fixed from this repo. Trusting
        # that exit code would make every PR red on day one, and a gate that is
        # red for reasons unrelated to the code gets switched off — which is how
        # the no-op above came to exist. See the script header for the full table.
        run: php scripts/security-audit-check.php

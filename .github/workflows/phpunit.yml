name: PHPUnit Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    name: PHPUnit Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: phlix_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysql, pdo, pdo_mysql, json, gd, zip, fileinfo, swoole, pcov
          # PCOV is dramatically faster than Xdebug for line-coverage, which keeps
          # the full ~3700-test suite comfortably inside timeout-minutes.
          coverage: pcov

      - name: Build and enable php-uv
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libuv1-dev
          git clone --depth=1 https://github.com/bwoebi/php-uv.git /tmp/php-uv
          cd /tmp/php-uv && phpize && ./configure --with-uv && make -j"$(nproc)" && sudo make install
          echo "extension=uv.so" | sudo tee "$(php-config --ini-dir 2>/dev/null || php -i | awk -F'=> ' '/Scan this dir/{print $2}')/zz-uv.ini"

      - name: Verify swoole + uv loaded
        run: php -m | grep -iE '^(swoole|uv)$'

      - name: Install ffmpeg
        run: sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Apply database migrations
        # Apply every migration to the MySQL service DB so real-DB Integration
        # tests run against the actual schema (table defs, foreign keys, bound
        # LIMIT queries) instead of a hand-rolled simulation. Idempotent: the
        # runner downgrades duplicate-column/key errors to notes.
        #
        # ⚠ S159 — this step is a GATE. Until S159 run-migrations.php printed
        # "  Warning: <error>" for a genuinely failing migration and then exited
        # 0 regardless, so this step could not go red and a broken migration
        # reached master invisibly. It now exits 1 when the runner recorded a
        # non-idempotent error. Do NOT "fix" a red here with `|| true` or
        # `continue-on-error` — read the Warning lines and fix the migration.
        #
        # An "already applied" replay is still exit 0, so a re-run is not a
        # failure — but only for a CLOSED LIST of four MySQL error numbers:
        # 1050 table exists, 1060 duplicate column, 1061 duplicate key name,
        # 1091 can't drop. A seed `INSERT` replayed (1062), `ADD PRIMARY KEY`
        # replayed (1068) and a duplicate FOREIGN KEY / CHECK constraint NAME
        # (1826 / 3822) are GENUINE failures on purpose, so a new migration must
        # use `INSERT IGNORE` / guard its `ADD PRIMARY KEY` / guard its
        # `ADD CONSTRAINT` rather than expect the squelch to cover it.
        # 1826/3822 were considered for the set and REJECTED: those names are
        # unique per SCHEMA, not per table, so the collision can be with another
        # table entirely and the failing statement may have created nothing.
        # See MigrationRunner::IDEMPOTENT_ERROR_CODES.
        #
        # Both directions are asserted by
        # tests/Integration/Common/Database/MigrationFailureVisibilityTest.php,
        # which runs in the PHPUnit step below.
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: phlix_test
          DB_USER: root
          DB_PASSWORD: root
        run: php scripts/run-migrations.php

      - name: Run PHPUnit tests
        # Run the full suite (Unit + Integration). This job provisions a MySQL
        # service container AND applies migrations (step above), so Integration
        # tests that probe 127.0.0.1:3306 execute for real here against the live
        # schema; they self-skip only when no DB is reachable (e.g. locally).
        # Coverage runs via PCOV (far faster than Xdebug). max_execution_time=0
        # keeps PHP's own 30s limit from firing. NOTE: the exit-142 "Alarm clock"
        # failures previously seen here were NOT PHP's time limit — they were a
        # stray SIGALRM from Workerman's pcntl Timer fallback when timer-using
        # units run outside an event loop. tests/bootstrap.php now swallows that
        # alarm so the suite always runs to completion.
        run: php -d max_execution_time=0 ./vendor/bin/phpunit --coverage-clover coverage.xml --coverage-html coverage-report

      - name: S120 assertion-escape guard
        # ADDITIVE step — it reads the report the PHPUnit extension registered in
        # phpunit.xml leaves behind when a test contained an assertion failure that did
        # not decide the test's outcome (an ExpectationFailedException swallowed between
        # the assertion and PHPUnit — by catch (\Throwable), catch (\Exception) or
        # catch (\RuntimeException), or by a `return` inside a `finally`).
        # No report file => exit 0. `if: always()` so it still reports when the suite
        # itself failed, which is exactly when a degraded message hurts most.
        #
        # Do NOT delete this step, add continue-on-error to it, or drop `if: always()`.
        # tests/Unit/Support/AssertionEscapeGuardWiringTest.php parses this file and
        # fails on each of those three edits, and on the removal of the <bootstrap>
        # registration in phpunit.xml that feeds it.
        if: always()
        run: php scripts/assertion-escape-check.php

      - name: Assert the coverage report and its parser exist
        # ADDITIVE guard, and the direct analogue of "Assert Psalm is actually
        # installed" in coding-standards.yml (S146). It exists because the
        # threshold step below spent the life of this repo reporting success
        # while measuring nothing: it shelled out to `xmllint`, which is NOT
        # installed on ubuntu-latest, hid the resulting "command not found"
        # behind `2>/dev/null`, substituted `0` via `|| echo "0"`, and then read
        # that `0` as "empty report — skip" and exited 0.
        #
        # Evidence (do not re-litigate): Ubuntu 24.04.4 LTS, image provisioner
        # 20260707.563 — `libxml2-utils` is absent from that image's
        # installed-apt-packages manifest. And in run 30354212368 the step body
        # started at 11:21:28.1580647 and printed its WARNING at
        # 11:21:28.1685980: 10.5 ms for two supposed parses of a ~4 MB Clover
        # report. Two real xmllint parses of that file measure 461 ms; two
        # command-not-found failures measure 5 ms.
        #
        # A missing tool must fail loudly rather than degrade into a no-op.
        run: |
          if [ ! -f coverage.xml ]; then
            echo "::error::coverage.xml was not produced by the 'Run PHPUnit tests' step. The coverage gate cannot run — fix the test run, do not skip the gate."
            exit 1
          fi
          if [ ! -s coverage.xml ]; then
            echo "::error::coverage.xml exists but is empty (0 bytes)."
            exit 1
          fi
          if ! php -r 'exit(class_exists("DOMDocument") && class_exists("DOMXPath") ? 0 : 1);'; then
            echo "::error::PHP is missing ext-dom (DOMDocument/DOMXPath). Add 'dom' to the setup-php extensions list — do not re-add a conditional that skips the coverage gate when its parser is missing (S146)."
            exit 1
          fi
          echo "coverage.xml present ($(wc -c < coverage.xml) bytes); PHP XML parser available."

      - name: Check minimum coverage threshold
        # The threshold logic is unchanged in intent — a MIN_COVERAGE floor over
        # statement coverage computed from Clover's
        # `statements`/`coveredstatements` on /coverage/project/metrics. The
        # XPath was never the problem and is preserved verbatim inside the
        # script; the Cobertura-style `line-rate` attribute still does not exist
        # in PHPUnit's output, so do not reach for it.
        #
        # What changed is WHO parses. scripts/coverage-threshold-check.php reads
        # the report with ext-dom and does the arithmetic in PHP, which removes
        # both external-tool dependencies this step used to carry: `xmllint`
        # (proven absent above) and `bc` (also absent from the Ubuntu 24.04
        # manifest — never observed failing only because the xmllint line
        # short-circuited three lines above it).
        #
        # Every failure mode in that script is exit 1: missing report, missing
        # parser, unparseable XML, missing/non-numeric metric, zero statements.
        # There is no `exit 0` fallback and no `|| echo "0"`. Do not add one —
        # a gate that cannot measure must not report success.
        env:
          MIN_COVERAGE: '40'
        run: php scripts/coverage-threshold-check.php coverage.xml

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          # Non-blocking: Codecov upload is informational. A repo not
          # yet activated in the Codecov UI returns "Repository not
          # found" — that should not fail the test workflow. Activate
          # at https://app.codecov.io to flip this on later.
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1
        # Non-blocking for the same reason as the Codecov step above: a missing
        # or expired token, or a repo not yet activated in the Codacy UI, must
        # not fail the test workflow. This action has no fail_ci_if_error input,
        # so continue-on-error is how that guarantee is expressed.
        # NOTE: continue-on-error makes a FAILED step report "success" — to check
        # whether an upload actually happened, read the step log for
        # "Coverage data uploaded successfully", not the step conclusion.
        continue-on-error: true
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          coverage-reports: ./coverage.xml

  test-server:
    name: Server Component Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, pcntl, posix, swoole, pcov
          # phpunit.xml sets failOnWarning="true"; with no coverage driver the
          # runner emits "No code coverage driver available", which trips that
          # flag and fails the job. PCOV is cheap, so enable it here too.
          coverage: pcov

      - name: Build and enable php-uv
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libuv1-dev
          git clone --depth=1 https://github.com/bwoebi/php-uv.git /tmp/php-uv
          cd /tmp/php-uv && phpize && ./configure --with-uv && make -j"$(nproc)" && sudo make install
          echo "extension=uv.so" | sudo tee "$(php-config --ini-dir 2>/dev/null || php -i | awk -F'=> ' '/Scan this dir/{print $2}')/zz-uv.ini"

      - name: Verify swoole + uv loaded
        run: php -m | grep -iE '^(swoole|uv)$'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Server-specific tests
        run: ./vendor/bin/phpunit tests/Unit/Server/

      - name: Check code style
        run: |
          if [ -f vendor/bin/phpcs ]; then
            ./vendor/bin/phpcs --standard=PSR12 src/Server/
          fi

  assertion-escape-probe:
    name: Assertion-Escape Prober (S180)
    runs-on: ubuntu-latest
    # ⚠ NOT because the prober is slow. That was the assumption S180 started from and
    # it is FALSE, measured: the full 22-site bulk probe takes **7.2 s** wall clock on
    # the dev box (`/usr/bin/time` → REAL=7.24 s), because every probed site is a fast
    # mocked-DB test. The one genuinely slow site (~16 s: it runs a whole coroutine
    # concurrency file) is the one the baseline excludes. Do not re-justify this job on
    # runtime.
    #
    # The real reasons, in order:
    #  1. ATTRIBUTION. A named check that can only mean "an assertion cannot fail its
    #     test" is legible; the same finding buried in the 11-step "PHPUnit Test
    #     Suite" job is not. The runtime half of S120's guard already lives there.
    #  2. The prober SPLICES tripwires into tracked test files and restores them. That
    #     belongs nowhere near the job that produces the coverage artifact.
    #  3. Its own timeout, so it cannot be starved by the `test` job's 25 minutes.
    timeout-minutes: 20

    # ⚠ THERE IS DELIBERATELY NO `if:` ON THIS JOB OR ON ANY OF ITS STEPS.
    # A skipped GitHub job reports conclusion `skipped`, and `skipped` COUNTS AS
    # SUCCESS for a status check — so an `if:` here would be a gate that passes by
    # not running, which is precisely the defect S120 exists to catch, one level up.
    # tests/Unit/Support/AssertionEscapeProbeGateTest.php asserts the absence of an
    # `if:` on BOTH this job and its probe step, and kills six more neutering edits.

    services:
      # Copied from the `test` job above, VERBATIM.
      #
      # MEASURED FIRST, so the reason is not a guess: no site this job probes needs
      # MySQL today — all 22 use a mocked Workerman\MySQL\Connection, and the probe
      # produced the identical 19 GATES / 3 NOT-REACHED census with a live
      # mysql:8.0.46 and with no database at all. The service is here for the FUTURE
      # case, and it is not hypothetical: a site whose test needs MySQL self-skips
      # without one, so its tripwire never executes, so it probes NOT-REACHED — and
      # the S180 baseline reconciliation would then red this job over an environment
      # difference instead of over anything in the diff. Matching the `test` job's
      # environment is what keeps a verdict here meaning the same thing as a verdict
      # there.
      #
      # The ONE site that is genuinely unsafe to probe is excluded BY NAME in
      # tests/Support/AssertionEscape/probe-baseline.json, with its measurement in the
      # `reason` field. That is how the known flake is kept out — NOT by withholding
      # the database, which would only have hidden it behind a second defect.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: phlix_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Same list as the `test` job. pcov is kept even though every probe run
          # passes --no-coverage: phpunit.xml configures a <coverage> section, and
          # failOnWarning="true" turns "No code coverage driver available" into a
          # failed run. php-uv is deliberately NOT built here (it costs minutes and
          # nothing the prober runs needs it); if a probed test ever does, this job
          # will say so loudly rather than skip.
          extensions: mysql, pdo, pdo_mysql, json, gd, zip, fileinfo, swoole, pcov
          coverage: pcov

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Apply database migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: phlix_test
          DB_USER: root
          DB_PASSWORD: root
        run: php scripts/run-migrations.php

      - name: Probe every assertion-bearing closure
        # S180. THE STATIC HALF of S120's guard. It plants a named tripwire before the
        # first assertion in each assertion-bearing closure under tests/, runs the
        # owning test, and reads the verdict off the run — so it decides, by
        # execution, whether that assertion can fail its test at all.
        #
        # It catches what the RUNTIME guard cannot: an assertion failure that never
        # reaches Assert::assertThat() emits no event, so Assert::fail(), mock
        # parameter/invocation rules and markTestSkipped() are invisible to it. The
        # live escape found on 2026-08-02
        # (tests/Unit/Playlists/SmartPlaylistRefreshSubscriberTest.php) was exactly
        # that shape: this prober reported it DEGRADED while the runtime guard
        # reported exit 0, silent.
        #
        # ⚠ ADDITIVE, NOT A REPLACEMENT. The enumeration is LEXICAL: 186 closures
        # reach an assertion only through a HELPER and carry no assert* token, so this
        # job sees none of them. The runtime guard (the "S120 assertion-escape guard"
        # step in the `test` job) covers those. A green here does NOT mean the suite
        # is free of swallowed assertions — do not delete either half because the
        # other one is green.
        #
        # Do NOT add `if:`, `continue-on-error:` or `|| true` to this step, and do not
        # narrow it to a subset of sites. The undecided (NOT-REACHED) census is
        # reconciled against tests/Support/AssertionEscape/probe-baseline.json in BOTH
        # directions, so the honest way to change what this job accepts is to edit that
        # JSON in a reviewable diff, with a reason.
        run: php scripts/assertion-escape-audit.php --probe

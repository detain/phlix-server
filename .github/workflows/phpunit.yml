name: PHPUnit Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    name: PHPUnit Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: phlix_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysql, pdo, pdo_mysql, json, gd, zip, fileinfo, swoole, pcov
          # PCOV is dramatically faster than Xdebug for line-coverage, which keeps
          # the full ~3700-test suite comfortably inside timeout-minutes.
          coverage: pcov

      - name: Build and enable php-uv
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libuv1-dev
          git clone --depth=1 https://github.com/bwoebi/php-uv.git /tmp/php-uv
          cd /tmp/php-uv && phpize && ./configure --with-uv && make -j"$(nproc)" && sudo make install
          echo "extension=uv.so" | sudo tee "$(php-config --ini-dir 2>/dev/null || php -i | awk -F'=> ' '/Scan this dir/{print $2}')/zz-uv.ini"

      - name: Verify swoole + uv loaded
        run: php -m | grep -iE '^(swoole|uv)$'

      - name: Install ffmpeg
        run: sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Apply database migrations
        # Apply every migration to the MySQL service DB so real-DB Integration
        # tests run against the actual schema (table defs, foreign keys, bound
        # LIMIT queries) instead of a hand-rolled simulation. Idempotent: the
        # runner downgrades duplicate-column/key errors to notes.
        #
        # ⚠ S159 — this step is a GATE. Until S159 run-migrations.php printed
        # "  Warning: <error>" for a genuinely failing migration and then exited
        # 0 regardless, so this step could not go red and a broken migration
        # reached master invisibly. It now exits 1 when the runner recorded a
        # non-idempotent error. Do NOT "fix" a red here with `|| true` or
        # `continue-on-error` — read the Warning lines and fix the migration.
        # An "already applied" replay is still exit 0, so a re-run is not a
        # failure. Both directions are asserted by
        # tests/Integration/Common/Database/MigrationFailureVisibilityTest.php,
        # which runs in the PHPUnit step below.
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: phlix_test
          DB_USER: root
          DB_PASSWORD: root
        run: php scripts/run-migrations.php

      - name: Run PHPUnit tests
        # Run the full suite (Unit + Integration). This job provisions a MySQL
        # service container AND applies migrations (step above), so Integration
        # tests that probe 127.0.0.1:3306 execute for real here against the live
        # schema; they self-skip only when no DB is reachable (e.g. locally).
        # Coverage runs via PCOV (far faster than Xdebug). max_execution_time=0
        # keeps PHP's own 30s limit from firing. NOTE: the exit-142 "Alarm clock"
        # failures previously seen here were NOT PHP's time limit — they were a
        # stray SIGALRM from Workerman's pcntl Timer fallback when timer-using
        # units run outside an event loop. tests/bootstrap.php now swallows that
        # alarm so the suite always runs to completion.
        run: php -d max_execution_time=0 ./vendor/bin/phpunit --coverage-clover coverage.xml --coverage-html coverage-report

      - name: S120 assertion-escape guard
        # ADDITIVE step — it reads the report the PHPUnit extension registered in
        # phpunit.xml leaves behind when a test contained an assertion failure that did
        # not decide the test's outcome (an ExpectationFailedException swallowed by a
        # catch (\Throwable) / catch (\RuntimeException) between the assertion and
        # PHPUnit). No report file => exit 0. `if: always()` so it still reports when
        # the suite itself failed, which is exactly when a degraded message hurts most.
        if: always()
        run: php scripts/assertion-escape-check.php

      - name: Assert the coverage report and its parser exist
        # ADDITIVE guard, and the direct analogue of "Assert Psalm is actually
        # installed" in coding-standards.yml (S146). It exists because the
        # threshold step below spent the life of this repo reporting success
        # while measuring nothing: it shelled out to `xmllint`, which is NOT
        # installed on ubuntu-latest, hid the resulting "command not found"
        # behind `2>/dev/null`, substituted `0` via `|| echo "0"`, and then read
        # that `0` as "empty report — skip" and exited 0.
        #
        # Evidence (do not re-litigate): Ubuntu 24.04.4 LTS, image provisioner
        # 20260707.563 — `libxml2-utils` is absent from that image's
        # installed-apt-packages manifest. And in run 30354212368 the step body
        # started at 11:21:28.1580647 and printed its WARNING at
        # 11:21:28.1685980: 10.5 ms for two supposed parses of a ~4 MB Clover
        # report. Two real xmllint parses of that file measure 461 ms; two
        # command-not-found failures measure 5 ms.
        #
        # A missing tool must fail loudly rather than degrade into a no-op.
        run: |
          if [ ! -f coverage.xml ]; then
            echo "::error::coverage.xml was not produced by the 'Run PHPUnit tests' step. The coverage gate cannot run — fix the test run, do not skip the gate."
            exit 1
          fi
          if [ ! -s coverage.xml ]; then
            echo "::error::coverage.xml exists but is empty (0 bytes)."
            exit 1
          fi
          if ! php -r 'exit(class_exists("DOMDocument") && class_exists("DOMXPath") ? 0 : 1);'; then
            echo "::error::PHP is missing ext-dom (DOMDocument/DOMXPath). Add 'dom' to the setup-php extensions list — do not re-add a conditional that skips the coverage gate when its parser is missing (S146)."
            exit 1
          fi
          echo "coverage.xml present ($(wc -c < coverage.xml) bytes); PHP XML parser available."

      - name: Check minimum coverage threshold
        # The threshold logic is unchanged in intent — a MIN_COVERAGE floor over
        # statement coverage computed from Clover's
        # `statements`/`coveredstatements` on /coverage/project/metrics. The
        # XPath was never the problem and is preserved verbatim inside the
        # script; the Cobertura-style `line-rate` attribute still does not exist
        # in PHPUnit's output, so do not reach for it.
        #
        # What changed is WHO parses. scripts/coverage-threshold-check.php reads
        # the report with ext-dom and does the arithmetic in PHP, which removes
        # both external-tool dependencies this step used to carry: `xmllint`
        # (proven absent above) and `bc` (also absent from the Ubuntu 24.04
        # manifest — never observed failing only because the xmllint line
        # short-circuited three lines above it).
        #
        # Every failure mode in that script is exit 1: missing report, missing
        # parser, unparseable XML, missing/non-numeric metric, zero statements.
        # There is no `exit 0` fallback and no `|| echo "0"`. Do not add one —
        # a gate that cannot measure must not report success.
        env:
          MIN_COVERAGE: '40'
        run: php scripts/coverage-threshold-check.php coverage.xml

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          # Non-blocking: Codecov upload is informational. A repo not
          # yet activated in the Codecov UI returns "Repository not
          # found" — that should not fail the test workflow. Activate
          # at https://app.codecov.io to flip this on later.
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1
        # Non-blocking for the same reason as the Codecov step above: a missing
        # or expired token, or a repo not yet activated in the Codacy UI, must
        # not fail the test workflow. This action has no fail_ci_if_error input,
        # so continue-on-error is how that guarantee is expressed.
        # NOTE: continue-on-error makes a FAILED step report "success" — to check
        # whether an upload actually happened, read the step log for
        # "Coverage data uploaded successfully", not the step conclusion.
        continue-on-error: true
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          coverage-reports: ./coverage.xml

  test-server:
    name: Server Component Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, pcntl, posix, swoole, pcov
          # phpunit.xml sets failOnWarning="true"; with no coverage driver the
          # runner emits "No code coverage driver available", which trips that
          # flag and fails the job. PCOV is cheap, so enable it here too.
          coverage: pcov

      - name: Build and enable php-uv
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libuv1-dev
          git clone --depth=1 https://github.com/bwoebi/php-uv.git /tmp/php-uv
          cd /tmp/php-uv && phpize && ./configure --with-uv && make -j"$(nproc)" && sudo make install
          echo "extension=uv.so" | sudo tee "$(php-config --ini-dir 2>/dev/null || php -i | awk -F'=> ' '/Scan this dir/{print $2}')/zz-uv.ini"

      - name: Verify swoole + uv loaded
        run: php -m | grep -iE '^(swoole|uv)$'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Server-specific tests
        run: ./vendor/bin/phpunit tests/Unit/Server/

      - name: Check code style
        run: |
          if [ -f vendor/bin/phpcs ]; then
            ./vendor/bin/phpcs --standard=PSR12 src/Server/
          fi

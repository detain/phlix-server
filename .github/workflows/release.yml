name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# S474 (S471 Finding 7): a dead workflow-level image env block lived here with
# zero references in the file — it implied a container publish step this
# workflow does not perform (it packages Helm charts as release assets).
# Removed; the real publishers are in docker.yml.

jobs:
  # M-SERVER-09: this job asserted (a) BOTH Helm charts' appVersion equal the
  # tag and (b) composer.json's `version` equal the tag. Both were
  # unsatisfiable against this repo's own documented version law
  # (RELEASE_PROCESS.md "Update Version"), and (a) is why every tagged
  # Release run since the trigger existed has been red: scripts/release.sh
  # only ever bumps src/Common/Version.php::STRING, VERSION and
  # k8s/helm/phlix/Chart.yaml — k8s/helm/phlix-hub/Chart.yaml sits in the
  # hub's version space (the runbook itself states the two products "share
  # no version space") — while (b) demanded composer.json carry the very
  # field `composer validate --strict` (the composer-validate CI job,
  # decision f5375f7a) refuses. What remains asserts exactly the trio the
  # release tooling writes, which is the documented law.
  verify-version-sources:
    name: Verify version sources match tag
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Assert version sources match tag
        run: |
          set -e
          # Mirrors carry only MAJOR.MINOR.PATCH, so a prerelease tag
          # (v1.3.0-beta.1 — the runbook's Beta channel, and the shape the
          # `prerelease:` expression below already expects) is compared on
          # its base version.
          TAG_VERSION="${{ steps.version.outputs.VERSION }}"
          BASE_VERSION="${TAG_VERSION%%-*}"
          if ! [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag version '$TAG_VERSION' has no MAJOR.MINOR.PATCH base"
            exit 1
          fi

          STRING_VERSION=$(sed -n "s/^[[:space:]]*public const STRING = '\([^']*\)';.*/\1/p" src/Common/Version.php)
          if [ "$STRING_VERSION" != "$BASE_VERSION" ]; then
            echo "::error file=src/Common/Version.php::STRING ($STRING_VERSION) does not match release tag base ($BASE_VERSION)"
            exit 1
          fi
          echo "OK: src/Common/Version.php::STRING=$STRING_VERSION matches tag base $BASE_VERSION"

          MARKER_VERSION=$(tr -d '[:space:]' < VERSION)
          if [ "$MARKER_VERSION" != "$BASE_VERSION" ]; then
            echo "::error file=VERSION::update marker ($MARKER_VERSION) does not match release tag base ($BASE_VERSION)"
            exit 1
          fi
          echo "OK: VERSION marker=$MARKER_VERSION matches tag base $BASE_VERSION"

          CHART_VERSION=$(sed -n 's/^version:[[:space:]]*"\?\([^"[:space:]]*\)"\?[[:space:]]*$/\1/p' k8s/helm/phlix/Chart.yaml)
          APP_VERSION=$(sed -n 's/^appVersion:[[:space:]]*"\?\([^"[:space:]]*\)"\?[[:space:]]*$/\1/p' k8s/helm/phlix/Chart.yaml)
          if [ "$CHART_VERSION" != "$BASE_VERSION" ] || [ "$APP_VERSION" != "$BASE_VERSION" ]; then
            echo "::error file=k8s/helm/phlix/Chart.yaml::version ($CHART_VERSION) / appVersion ($APP_VERSION) do not match release tag base ($BASE_VERSION)"
            exit 1
          fi
          echo "OK: k8s/helm/phlix/Chart.yaml version=$CHART_VERSION appVersion=$APP_VERSION matches tag base $BASE_VERSION"

          # The law pins composer.json ABSENT of a version field; enforce the
          # law instead of contradicting it.
          if python3 -c "import json,sys; sys.exit(0 if 'version' in json.load(open('composer.json')) else 1)"; then
            echo "::error file=composer.json::carries a 'version' field, which composer validate --strict rejects (f5375f7a) — scripts/release.sh never writes one"
            exit 1
          fi
          echo "OK: composer.json carries no version field (f5375f7a law)"
          echo "NOTE: k8s/helm/phlix-hub/Chart.yaml is intentionally NOT asserted — it lives in the hub version space (RELEASE_PROCESS.md)"

  package-charts:
    name: Package Helm charts
    runs-on: ubuntu-26.04
    needs: verify-version-sources
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Lint charts
        run: |
          helm lint k8s/helm/phlix
          helm lint k8s/helm/phlix-hub

      - name: Package charts
        run: |
          mkdir -p dist/charts
          helm package k8s/helm/phlix -d dist/charts
          helm package k8s/helm/phlix-hub -d dist/charts
          ls -la dist/charts/

      - name: Upload chart artifacts
        uses: actions/upload-artifact@v7
        with:
          name: helm-charts
          path: dist/charts/*.tgz
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-26.04
    needs: [verify-version-sources, package-charts]

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download chart artifacts
        uses: actions/download-artifact@v8
        with:
          name: helm-charts
          path: dist/charts

      - name: Generate changelog
        id: changelog
        run: |
          CHANGELOG=$(git log --pretty=format:'%s' ${{ github.ref_name }}..HEAD 2>/dev/null | head -20 || echo "See CHANGELOG.md for details")
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "## What's Changed" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ github.ref_name }}...HEAD" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Phlix Server ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          # M-SERVER-09: the files list also carried the coverage tarball's
          # name — a path no step of this workflow (nor the repo) ever
          # produces. The only historical green Release runs pinned
          # softprops/action-gh-release@v1, which tolerated it; at the
          # current @v3 pin it is a dead reference removed, leaving the chart
          # packages the job builds. ReleaseWorkflowTest keeps it out.
          files: |
            dist/charts/*.tgz

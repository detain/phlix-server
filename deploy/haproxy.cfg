# HAProxy configuration for Phlix Media Server WebSocket worker exposure
# SP7: Front the WS worker for external clients.
#
# Deployment truth (verified against start.php @ master):
#   - The daemon's WebSocket worker listens on 0.0.0.0:8097 — the literal
#     'websocket://0.0.0.0:8097' is hard-coded in start.php (~line 610).
#     The config/server.php 'websocket.host'/'port' keys configure the
#     WebSocketServer OBJECT (timeouts, JWT auth); they do NOT move this
#     listening socket on the resident start.php path.
#   - The HTTP API worker is a separate listener on :8096 (/health lives there).
#   - :8097 speaks ONLY the WebSocket handshake. A plain HTTP GET returns
#     400 Bad Request (Workerman's Websocket protocol rejects non-handshake
#     requests). 426 Upgrade Required appears ONLY when the request carries a
#     'Sec-WebSocket-Version' header whose value is not 13 — a health check
#     cannot produce that, so no HTTP-status health probe can ever pass here.
#     Backend liveness therefore MUST be a TCP connect check.
#
# PORT PREREQUISITE — do not bind this frontend onto :8097 while the daemon
# is running, or HAProxy fails at startup with EADDRINUSE ("bind ... cannot
# assign requested address"). Two honest postures:
#
#   A) Shipped default below: HAProxy exposes the WS worker on :8443, the
#      daemon keeps :8097 for loopback, and you firewall the raw daemon port
#      from untrusted networks (ufw does not filter loopback, so the
#      127.0.0.1 backend keeps working):
#          sudo ufw deny 8097/tcp && sudo ufw allow 8443/tcp
#      Configure clients to connect ws://<host>:8443 (wss:// if you add TLS).
#
#   B) Keep the client-visible port at 8097: first change the start.php bind
#      literal to 'websocket://127.0.0.1:8097' (daemon on loopback only),
#      restart the daemon, then swap the frontend bind below to *:8097 (the
#      alternative line is provided commented-out).
#
# Usage:
#   haproxy -f deploy/haproxy.cfg
#
# Verification (see also deploy.yaml):
#   curl -s -o /dev/null -w '%{http_code}\n' http://<deploy-host>:8443/    # 400 = worker alive
#   curl -s -o /dev/null -w '%{http_code}\n' http://<deploy-host>:8098/    # 400 = worker alive

# Global settings
global
    log stdout format raw local0
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon
    # WebSocket connections are long-lived; allow sufficient connection limits
    maxconn 4096

# Default settings with WebSocket-appropriate timeouts
defaults
    mode http
    log global
    option httplog
    option dontlognull
    # Keep per-request analysis; HAProxy 2.x detects the WebSocket Upgrade in
    # HTTP mode and switches to a byte tunnel automatically.
    option http-server-close
    # WebSocket-specific timeouts - connections can be long-lived
    timeout connect 5000
    timeout client 86400      # 24h client connection (WS ping/pong keepalive)
    timeout server 86400      # 24h server connection
    # Post-upgrade tunneled WS connections use 'timeout tunnel'; without it
    # HAProxy falls back to client/server timeouts (same value here, declared
    # explicitly so the intent survives future tuning of those).
    timeout tunnel 86400
    timeout http-request 10s
    timeout http-keep-alive 10s
    # Health check interval
    timeout check 5s

# Health check frontend for monitoring WS worker availability
# Listens on port 8098 (separate from the WS frontends) for external probes.
# A LIVE worker answers 400 Bad Request (it only speaks the WS handshake);
# connection refused / 503 from HAProxy means the worker is down.
frontend ws-health-check
    bind *:8098
    mode http
    option httplog
    default_backend ws-health-backend

backend ws-health-backend
    mode http
    # TCP connect check ONLY. Never add 'option httpchk' here: an HTTP probe
    # gets 400 from the worker, and 'http-check expect status 426' can never
    # pass (426 requires a Sec-WebSocket-Version header the probe won't send),
    # which would mark a healthy worker DOWN forever.
    server ws-worker 127.0.0.1:8097 check inter 5s fall 2 rise 3

# Main WebSocket frontend - exposes the WS worker to the external network.
# See PORT PREREQUISITE in the header before changing the bind.
frontend ws-external
    # Posture A (shipped): distinct port, daemon keeps :8097 on the host.
    bind *:8443
    # Posture B alternative (only after binding the daemon to 127.0.0.1 in
    # start.php — see header): uncomment below and comment the line above.
    #   bind *:8097
    mode http
    option httplog
    # No X-Forwarded-* rewrites: the WS worker (Workerman) does not currently
    # read forwarded headers, and a TLS bind is not configured on this
    # frontend. Add TLS termination + proxy_protocol if you need client-IP
    # preservation through a TLS frontend.
    default_backend ws-worker-backend

# WebSocket backend - forwards to the internal WS worker.
# HAProxy handles the WebSocket upgrade transparently in HTTP mode.
backend ws-worker-backend
    mode http
    # Same rule as ws-health-backend: TCP connect check only, no httpchk.
    server ws-worker 127.0.0.1:8097 check inter 10s fall 2 rise 3

# Statistics endpoint for monitoring (optional, bound to localhost only)
# Access: http://localhost:8404/stats
listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE

# HAProxy configuration for Phlix Media Server WebSocket worker exposure
# SP7: Expose the WS worker on :8097 to the external network
#
# This config exposes the internal WebSocket worker (running on 127.0.0.1:8097)
# to the external network via HAProxy on port 8097.
#
# Usage:
#   haproxy -f deploy/haproxy.cfg
#
# The WS worker health endpoint responds to HTTP/1.1 with 101 Switching Protocols
# when the Upgrade header requests WebSocket, indicating it's ready for WS connections.
#
# Verification:
#   curl -s https://<deploy-host>:8097/health   # Should return 101 (WS upgrade) or 426
#   curl -s -H "Upgrade: websocket" http://<deploy-host>:8097/  # WS upgrade request

# Global settings
global
    log stdout format raw local0
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon
    # WebSocket connections are long-lived; allow sufficient connection limits
    maxconn 4096

# Default settings with WebSocket-appropriate timeouts
defaults
    mode http
    log global
    option httplog
    option dontlognull
    # Maintain connection close behavior for WS upgrade
    option http-server-close
    # WebSocket-specific timeouts - connections can be long-lived
    timeout connect 5000
    timeout client 86400      # 24h client connection (WS ping/pong keepalive)
    timeout server 86400      # 24h server connection
    timeout http-request 10s
    timeout http-keep-alive 10s
    # Health check interval
    timeout check 5s

# Health check frontend for monitoring WS worker availability
# Listens on port 8098 (separate from WS port) for external health checks
# This allows load balancers to check WS worker health without consuming WS slots
frontend ws-health-check
    bind *:8098
    mode http
    option httplog
    # Health endpoint - HTTP 426 indicates WS worker is alive but requires upgrade
    # for actual WS connections. A 426 response to a GET means the worker is responsive.
    default_backend ws-health-backend

backend ws-health-backend
    mode http
    # The WS worker returns 426 Upgrade Required for any HTTP request
    # This is expected behavior - the worker IS alive, it just speaks WS
    option httpchk
    http-check expect status 426
    server ws-worker 127.0.0.1:8097 check inter 5s fall 2 rise 3

# Main WebSocket frontend - exposes port 8097 to external network
# Proxies WebSocket connections to the internal WS worker at 127.0.0.1:8097
frontend ws-external
    bind *:8097
    mode http
    option httplog
    # Enable WebSocket support - required for WS upgrade
    http-request set-header X-Forwarded-For %[hdr(x-forwarded-for)]
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    # Default backend for WebSocket traffic
    default_backend ws-worker-backend

# WebSocket backend - forwards to internal WS worker
backend ws-worker-backend
    mode http
    option forwardfor
    # WebSocket upgrade support - HAProxy automatically handles the upgrade
    # when both client and server support it
    option http-server-close
    # Increased timeout for long-lived WS connections
    timeout server 86400
    # Health check using WS handshake - the worker responds to HTTP with 426
    option httpchk GET /
    http-check expect status 426
    # Point to internal WS worker on port 8097
    server ws-worker 127.0.0.1:8097 check inter 10s fall 2 rise 3

# Statistics endpoint for monitoring (optional, bound to localhost only)
# Access: http://localhost:8404/stats
listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE

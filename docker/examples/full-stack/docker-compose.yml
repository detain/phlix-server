# Full-stack example: Traefik TLS edge + phlix-hub + phlix-server + MySQL each.
#
# Ports the daemons ACTUALLY bind (disk-verified against both repos):
#   phlix-server: :8096 HTTP (ZERO WS-upgrade logic), :8097 SyncPlay WS
#                 (SEPARATE plaintext listener; plain GET -> 400 = alive).
#   phlix-hub:    :8800 HTTP (HUB_PORT), :8802 relay WS worker (FIXED port —
#                 there is no HUB_RELAY_PORT/HUB_RELAY_ENABLED env; relay TLS
#                 is HUB_RELAY_TLS/HUB_RELAY_TLS_CERT/HUB_RELAY_TLS_KEY).
#
# Hub env names: the hub reads HUB_DB_* + HUB_JWT_SECRET — the pristine
# version of this example set HUB_DATABASE_*/HUB_SECRET_KEY/JWT_SECRET, names
# NO phlix-hub code reads. HUB_SECRET_KEY below is only the .env carrier name.
#
# Publish policy (R7-05): 80/443 are the TLS edge BY DESIGN in this example
# and stay public; the relay entrypoint (host :8802) is public on purpose too
# — geographically remote phlix-servers must dial the hub relay. MySQL stays
# unpublished. The server's :8097 SyncPlay WS is deliberately NOT routed
# here: see the comment in the phlix-server block.
#
# Secrets policy (R7-04): every DB password resolves through ${VAR:?…};
# docker/examples/.env.example self-gates likewise; the server entrypoint
# also refuses change_me* placeholders at boot.
#
# Migrations (R14-12): PHLIX_MIGRATIONS_STRICT=1 / HUB_MIGRATIONS_STRICT=1 —
# refuse to boot on a failed migration. Dev opt-out: set to `0`.

version: '3.8'

services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    ports:
      # TLS edge by design — public on purpose (ACME http-challenge + HTTPS).
      - "80:80"
      - "443:443"
      # Relay TCP entrypoint (traefik.yml entryPoints.relay). Remote
      # phlix-servers dial hub.example.com:8802, so this mapping is public on
      # purpose. The pristine version mapped 3473:3473 — a port nothing in
      # the stack listens on.
      - "8802:8802"
    environment:
      - TZ=UTC
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik_certs:/etc/traefik/certs
    networks:
      - phlix_network
    restart: unless-stopped

  phlix-hub:
    image: "${PHLIX_HUB_IMAGE:?PHLIX_HUB_IMAGE must be set to an immutable pin, form ghcr.io/detain/phlix-hub:<sha12> — the published hub :latest is frozen/stale}"
    container_name: phlix-hub
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.phlix-hub.rule=Host(`hub.example.com`)"
      - "traefik.http.routers.phlix-hub.tls=true"
      - "traefik.http.routers.phlix-hub.tls.certresolver=letsencrypt"
      # Hub HTTP is :8800 (was 443 — the hub terminates no TLS).
      - "traefik.http.services.phlix-hub.loadbalancer.server.port=8800"
      # The relay TCP router lives in traefik/dynamic.yml (file provider) as
      # the single source of truth; the pristine file defined it BOTH here and
      # there, which yields two same-named routers on the relay entrypoint.
    environment:
      - HUB_DB_HOST=mysql-hub
      - HUB_DB_PORT=3306
      - HUB_DB_NAME=phlix_hub
      - HUB_DB_USER=phlix_hub
      - HUB_DB_PASSWORD=${HUB_DB_PASSWORD:?HUB_DB_PASSWORD is required — see docker/examples/.env.example header (no committed default survives)}
      # Hub's ONLY real secret env; HUB_SECRET_KEY is the .env carrier name.
      # Unset triggers auto-generate persisted under /var/phlix/config — NOT
      # covered by this example's hub volumes — so set it explicitly.
      - HUB_JWT_SECRET=${HUB_SECRET_KEY:-}
      # Must match the router Host() rule so relay/enrollment URLs advertise
      # the right origin.
      - HUB_BASE_URL=https://hub.example.com
      # Relay listener TLS (end-to-end wss through the passthrough router):
      # mount a cert/key and uncomment. Without these the relay is plaintext
      # between Traefik's TCP passthrough and hub:8802.
      # - HUB_RELAY_TLS=true
      # - HUB_RELAY_TLS_CERT=/var/phlix-hub/config/relay.crt
      # - HUB_RELAY_TLS_KEY=/var/phlix-hub/config/relay.key
      - HUB_MIGRATIONS_STRICT=1
    volumes:
      - hub_config:/var/phlix-hub/config
      - hub_logs:/var/phlix-hub/logs
    depends_on:
      mysql-hub:
        condition: service_healthy
    # The Phlix container's PID 1 exits 70 when a supervised program enters
    # FATAL (a total application outage), and 0 on a clean stop — see
    # docker/README.md "What the container's exit code means".
    # `unless-stopped` restarts on ANY exit, so a persistent fault becomes a
    # restart loop that re-runs the migration chain each cycle. Swap to
    # `on-failure:5` if you would rather it stay `Exited (70)` for monitoring.
    restart: unless-stopped
    networks:
      - phlix_network

  phlix-server:
    image: "${PHLIX_SERVER_IMAGE:?PHLIX_SERVER_IMAGE must be set to an immutable pin, form ghcr.io/detain/phlix-server:<full-sha>-<latest|intel|nvidia> — the mutable :latest tag drifts and is never a reproducible example}"
    container_name: phlix-server
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.phlix-server.rule=Host(`server.example.com`)"
      - "traefik.http.routers.phlix-server.tls=true"
      - "traefik.http.routers.phlix-server.tls.certresolver=letsencrypt"
      # The container runs the Workerman daemon directly (no nginx, no
      # php-fpm), so Traefik targets 8096 — the port start.php binds.
      - "traefik.http.services.phlix-server.loadbalancer.server.port=8096"
      # SyncPlay's :8097 WS worker is NOT routed here on purpose: it is a
      # separate plaintext listener that HTTP path routing cannot reach
      # (Traefik targeting 8096 will never answer an Upgrade — the pristine
      # 'wss via 8096' story was fiction). To serve SyncPlay through this
      # edge, mirror the relay pattern from traefik/dynamic.yml: a tcp router
      # on a public entrypoint forwarding to phlix-server:8097, or publish
      # the port and accept trusted-LAN plaintext. A same-origin wss path is
      # being designed alongside the @phlix/ui wsUrl seam (sibling lane);
      # until it lands, do not add an HTTP path router for it against :8096.
    environment:
      - PHLIX_DATABASE_HOST=mysql-server
      - PHLIX_DATABASE_PORT=3306
      - PHLIX_DATABASE_NAME=phlix
      - PHLIX_DATABASE_USER=phlix
      - PHLIX_DATABASE_PASSWORD=${PHLIX_DB_PASSWORD:?PHLIX_DB_PASSWORD is required — see docker/examples/.env.example header (no committed default survives)}
      - PHLIX_SECRET_KEY=${PHLIX_SECRET_KEY}
      - PHLIX_HUB_URL=https://hub.example.com
      - PHLIX_LOG_LEVEL=info
      - PHLIX_MIGRATIONS_STRICT=1
    volumes:
      - phlix_config:/var/phlix/config
      - phlix_data:/var/phlix/data
      - phlix_backups:/var/phlix/backups
      - phlix_logs:/var/phlix/logs
      - media_library:/media:ro
    depends_on:
      mysql-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - phlix_network

  mysql-hub:
    image: mysql:8.0
    container_name: phlix-hub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required — see docker/examples/.env.example header (no committed default survives)}
      MYSQL_DATABASE: phlix_hub
      MYSQL_USER: phlix_hub
      MYSQL_PASSWORD: ${HUB_DB_PASSWORD:?HUB_DB_PASSWORD is required — see docker/examples/.env.example header (no committed default survives)}
    # Explicitly unpublished: MySQL is reached only over phlix_network.
    ports: []
    volumes:
      - mysql_hub_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - phlix_network

  mysql-server:
    image: mysql:8.0
    container_name: phlix-server-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required — see docker/examples/.env.example header (no committed default survives)}
      MYSQL_DATABASE: phlix
      MYSQL_USER: phlix
      MYSQL_PASSWORD: ${PHLIX_DB_PASSWORD:?PHLIX_DB_PASSWORD is required — see docker/examples/.env.example header (no committed default survives)}
    ports: []
    volumes:
      - mysql_server_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - phlix_network

volumes:
  phlix_config:
  phlix_data:
  phlix_backups:
  phlix_logs:
  media_library:
  hub_config:
  hub_logs:
  mysql_hub_data:
  mysql_server_data:
  traefik_certs:

networks:
  phlix_network:
    driver: bridge

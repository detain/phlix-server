; ============================================================================
; S163: this file now lands in the scan directory the DAEMON actually reads.
;
; It used to be written to `/etc/php/8.3/fpm/conf.d/` on the intel/nvidia
; images — an fpm-only directory that the Workerman CLI process never scans —
; so every setting below was inert for the application. Making it effective is
; a behaviour change, and two values had to be revisited because of it.
; ============================================================================

[php]
; ⚠ NOT 256M. (S163 review F5)
;
; 256M was inert for the daemon before this change, so switching the file to
; the CLI scan dir would have silently imposed a NEW, UNMEASURED cap on a
; resident process — and not just on request handling: the same daemon forks
; the library-scan, media-asset and similarity workers, which run getid3 over
; whole media files and decode artwork. A host install has no such cap
; (Debian/Ubuntu ship `memory_limit = -1` in the CLI php.ini, confirmed on the
; dev box), and neither does the systemd unit. `-1` therefore keeps container
; and host behaviour IDENTICAL instead of inventing a limit nobody measured.
; Set a real number here only with a measurement to justify it; the container's
; own cgroup memory limit is the appropriate ceiling in the meantime.
memory_limit = -1
upload_max_filesize = 100M
post_max_size = 100M
; Ignored by the CLI SAPI (which is what runs here) — kept for parity with the
; documented host configuration rather than pretending they do something.
max_execution_time = 300
max_input_time = 300

[opcache]
; `opcache.enable` alone does NOTHING for a CLI process: opcache is compiled in
; but stays off unless `opcache.enable_cli` is also set. The whole block below
; was therefore decorative for the daemon even where the file WAS read. Turning
; it on is the point of shipping these values at all — a resident server that
; recompiles every request's classes is the one workload opcache exists for.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
; ⚠ NOT 0. (S163 review round 2, finding 4)
;
; This was `opcache.validate_timestamps = 0`, justified by "the code in an
; image is immutable: nothing can change on disk without a new image". That
; premise is FALSE for this application: the plugin installer writes PHP into
; the running container. `src/Plugins/Installer/HttpInstaller.php` extracts a
; plugin into `var/plugins/<name>/` and `ComposerRunner` then runs composer
; inside it; `docker/Dockerfile` creates `/var/www/html/var` precisely so it
; can. Plugin UPDATE — which replaces `var/plugins/<name>/` in place — is a
; live, documented operator path on this project.
;
; With validation off, an updated plugin keeps executing the PREVIOUSLY cached
; bytecode until the container restarts, with a mixed old/new file set in the
; interim. That is a silent, permanent wrong-code condition; the failure mode
; of getting it wrong is far worse than the stat() calls it saves.
;
; Why 1 + revalidate_freq and not `opcache.blacklist_filename`:
;   * a blacklist has to ENUMERATE every path written at runtime. `var/plugins`
;     is the one we know of today. A blacklist that misses a future one fails
;     SILENTLY and permanently — the same shape as the premise above.
;   * it would also need a new file COPYed into all three images, i.e. one more
;     thing that can be dropped from a Dockerfile without any test noticing.
;   * the saving is a stat() per file per revalidate_freq window. At 60s, for a
;     resident daemon, that is noise next to the compile it still avoids.
; Revisit only with a measurement.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.save_comments = 1

[date]
date.timezone = UTC

[xdebug]
; Default mode is OFF - use XDEBUG_MODE env var to enable
; Options: off, develop, trace, debug (can combine with comma: "develop,trace")
xdebug.mode = ${XDEBUG_MODE:-off}
xdebug.start_with_request = trigger
xdebug.trigger_value = "${XDEBUG_TRIGGER:-devdebug}"
xdebug.trace_output_dir = /tmp/xdebug
xdebug.max_nesting_level = 512
xdebug.collect_assignments = 1
xdebug.collect_return_value = 1

; ============================================================================
; Phlix Server — container process supervision.
; ============================================================================
;
; THE SERVING MODEL, WRITTEN DOWN (S163)
; --------------------------------------
; The container runs the Workerman DAEMON and nothing else. There is no nginx
; and no php-fpm in the serving path, because there is none in production
; either: `scripts/install.sh` (phlix_haproxy_write_fragment_server) points
; HAProxy straight at `127.0.0.1:${HTTP_PORT}` with the note "WebSocket upgrade
; is detected per-request; both REST and WS traffic share the single HTTP port
; on the Workerman side". Workerman serves the `/app` SPA shell and every static
; asset itself (`HttpHandler::serveStatic()`), so nothing is lost. TLS and host
; routing remain the job of whatever fronts the container.
;
; WHAT THIS FILE USED TO SAY, AND WHY IT NEVER WORKED
; ---------------------------------------------------
; It declared three programs — nginx, php-fpm and "workerman" — and the
; "workerman" one ran:
;
;     command=php /var/www/html/public/index.php start
;
; `public/index.php` is the one-shot CGI/FPM front controller. It ignores argv,
; has no `start` verb, serves one synthetic request and returns. supervisord
; logged `exited: workerman (exit status 0; not expected)` five times in eight
; seconds and then `gave up: workerman entered FATAL state`. So HTTP :8096,
; SyncPlay WS :8097, the hub heartbeat, the relay tunnel, DLNA, the metrics
; flush and every scheduled worker have NEVER started in any container. The real
; daemon is `start.php` (`Worker::runAll()`) — the same thing
; `systemd/phlix-server.service:14` runs on a real box.
;
; The other two programs were equally dead: `php-fpm -F` is not a binary on
; Ubuntu (only `php-fpm8.3`), and on Alpine `user=nobody` made php-fpm fail to
; reopen `/proc/self/fd/2` (exit 78 → FATAL). Both are deleted rather than
; patched: with the daemon serving directly they have nothing left to do.
;
; A `docker build` never executes CMD, so none of this was visible to CI. The
; gate that now is: `scripts/docker-boot-smoke.sh` + the `docker-boot-gate` job.
; ============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/phlix/logs/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

; `supervisorctl status` was unusable — no HTTP server, no RPC interface — so
; the one command an operator (and the boot gate) would reach for answered
; "unix:///run/supervisord.sock no such file" while the container reported Up.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ----------------------------------------------------------------------------
; The application. ONE program: the Workerman master, which forks and supervises
; its own worker groups (14 HTTP on :8096, 1 SyncPlay WS on :8097, hub
; heartbeat, relay tunnel, background timers, the managed scan/asset/similarity
; workers and the DLNA SSDP advertiser).
;
; startsecs=15 is deliberate: `start.php` refuses to boot on a missing JWT
; signing key and on a missing pcntl, and both exit within a second. A short
; startsecs would let supervisord call that "RUNNING" before it died.
; stopasgroup/killasgroup are required because the master forks — signalling
; only the master leaves orphaned workers holding :8096.
; ----------------------------------------------------------------------------
[program:phlix]
command=php /var/www/html/start.php start
directory=/var/www/html
autostart=true
autorestart=true
startsecs=15
startretries=3
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/var/phlix/logs/phlix.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/phlix/logs/phlix-error.log
stderr_logfile_maxbytes=10MB
user=nobody
numprocs=1

; ----------------------------------------------------------------------------
; Turn FATAL into a DEAD CONTAINER. (S163 review F6)
;
; supervisord keeps running after a program gives up, so `docker ps` reports
; `Up` with nothing serving and no restart policy ever fires — the exact shape
; of the outage this step exists to fix. This listener signals PID 1 on the
; first PROCESS_STATE_FATAL so the failure reaches whatever supervises the
; container.
;
; ⚠ READ THIS BEFORE EDITING EITHER FILE. (S163 review round 2 finding 3,
; round 3 finding 6.) supervisord is NOT PID 1 in these images any more —
; `docker/docker-entrypoint.sh` keeps PID 1 and runs supervisord as its child.
; That is deliberate and it is load-bearing:
;
;   * `kill -TERM 1` alone made the container exit **0**, because supervisord
;     treats TERM as a clean shutdown. `restart: on-failure`, k8s `OnFailure`,
;     `docker wait` and every exit-code alert then read a total outage as
;     success.
;   * So this listener writes `$PHLIX_SUPERVISOR_FATAL_MARKER`
;     (default /var/run/phlix-supervisor-fatal) BEFORE it signals, and the
;     entrypoint turns that marker into container exit code **70**. Delete the
;     marker write, or `exec` supervisord directly again, and the FATAL becomes
;     indistinguishable from `docker stop`.
;   * The marker lives in /var/run, which is root-owned 755 — the `nobody`
;     daemon cannot forge it.
;
; The boot gate covers both halves: `fatal-kills-container` (the container dies)
; and `fatal-exit-code-nonzero` (it dies with 70, not 0), plus
; `stability-listener`, because a listener that crash-loops is a listener that
; is not there when the FATAL arrives.
;
; ⚠ This catches FATAL only, and FATAL is only reachable for a program that
; fails to START (i.e. dies inside `startsecs`). A program that dies AFTER
; startsecs is restarted forever and NEVER reaches FATAL — supervisor has no
; "max restarts per unit time" for that case. That is not a gap in this
; listener, it is a property of supervisor, and it is why the boot gate's
; ASSERT 5 samples uptime/pid over a real interval instead of trusting a status
; line. Do not delete one thinking the other covers it.
; ----------------------------------------------------------------------------
[eventlistener:exit-on-fatal]
command=sh /var/www/html/docker/supervisord-exit-on-fatal.sh
events=PROCESS_STATE_FATAL
autostart=true
autorestart=true
stdout_logfile=/var/phlix/logs/supervisord-exit-on-fatal.log
stderr_logfile=/var/phlix/logs/supervisord-exit-on-fatal-error.log

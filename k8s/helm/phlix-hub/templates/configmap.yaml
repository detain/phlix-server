apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "phlix-hub.fullname" . }}
  labels:
    {{- include "phlix-hub.labels" . | nindent 4 }}
data:
  # APP_ENV (not PHLIX_HUB_APP_ENV): the hub's dev-flag probe reads APP_ENV /
  # HUB_ENV; "production" here keeps the dev random-secret fallback unreachable.
  # Log level is NOT wired — the hub image reads no log-level env; it is fixed
  # in the shipped config (values.config.log_level is kept for future use).
  APP_ENV: "production"

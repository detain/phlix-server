apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "phlix-hub.fullname" . }}
  labels:
    {{- include "phlix-hub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "phlix-hub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "phlix-hub.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "phlix-hub.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: '{{ .Values.image.repository }}:{{ required "phlix-hub chart: image.tag is REQUIRED — nothing falls back silently. The published :latest is frozen/stale (unchanged since 2026-08-31) and the old AppVersion fallback was never published to ghcr. Set image.tag to an immutable short-sha tag, form: ghcr.io/detain/phlix-hub:<sha12>" .Values.image.tag }}'
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            # Hub listens on HTTP :8800 (serves /health, HUB_PORT) and a
            # SEPARATE relay WebSocket worker on :8802 (relay_port). Nothing
            # listens on 80 or 9443. Probes use the named port 'http'.
            - name: http
              containerPort: 8800
              protocol: TCP
            - name: relay
              containerPort: 8802
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          env:
            # Real hub image env names (phlix-hub config/database.php +
            # docker/docker-entrypoint.sh read HUB_DB_*; the previous
            # PHLIX_HUB_DATABASE_* names were read by nothing, so the pod
            # silently fell back to 127.0.0.1/phlix_hub defaults).
            - name: HUB_DB_HOST
              value: {{ tpl (.Values.config.database_host | toString) . | quote }}
            - name: HUB_DB_PORT
              value: {{ .Values.config.database_port | quote }}
            - name: HUB_DB_NAME
              value: {{ .Values.config.database_name | quote }}
            - name: HUB_DB_USER
              value: {{ .Values.config.database_user | quote }}
            - name: HUB_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "phlix-hub.fullname" . }}
                  key: database-password
            # HUB_JWT_SECRET is the hub's only signing secret (config/auth.php).
            - name: HUB_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "phlix-hub.fullname" . }}
                  key: secret-key
            # Public URL feeds enrollment/relay link building (config/server.php).
            - name: HUB_BASE_URL
              value: {{ .Values.config.public_url | quote }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "phlix-hub.fullname" . }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: logs
              mountPath: /var/phlix-hub/logs
      volumes:
        - name: logs
          {{- if and .Values.persistence.enabled .Values.persistence.logs.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "phlix-hub.fullname" . }}-logs
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "phlix-hub.fullname" . }}
  labels:
    {{- include "phlix-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* SH-027: required() only proves non-emptiness — values.example.yaml's
    public bait ("CHANGE_ME", "openssl rand -hex 64") used to sail through it
    and boot with forgeable credentials. Both keys now ride the chart's
    placeholder refusal, same doctrine as the server chart's M29 guard. */ -}}
  database-password: {{ include "phlix-hub.rejectKnownPlaceholder" (list "config.database_password" (required "config.database_password is required" .Values.config.database_password)) | quote }}
  secret-key: {{ include "phlix-hub.rejectKnownPlaceholder" (list "config.secret_key" (required "config.secret_key is required" .Values.config.secret_key)) | quote }}

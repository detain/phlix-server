# Default values for phlix-hub.

# Number of phlix-hub pods to run (stateless, scale horizontally behind a shared DB)
replicaCount: 2

image:
  # Container image repository for phlix-hub
  repository: ghcr.io/detain/phlix-hub
  pullPolicy: IfNotPresent
  # Image tag — REQUIRED, there is no default. The published :latest is frozen/stale
  # (unchanged since 2026-08-31), and the old fallback to .Chart.AppVersion pointed at a
  # tag never published to ghcr, so neither produced a reproducible deployment. The hub
  # publishes short-SHA tags; the immutable form is
  #   ghcr.io/detain/phlix-hub:<sha12>
  # Leaving it empty fails `helm template`/`helm install` loudly (see templates/deployment.yaml).
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  # ClusterIP works well behind a Kubernetes Ingress
  type: ClusterIP
  http:
    # HTTP/API service port (routes to the hub's HTTP worker on :8800 via
    # the named targetPort 'http')
    port: 80
  relay:
    # Relay WebSocket worker port (container listens on :8802, a separate
    # listener). phlix-server connects to ws(s)://<hub>:8802 directly — this
    # needs an L4 route (LoadBalancer/NodePort or TCP mesh route); HTTP
    # ingress path rules cannot reach a separate WS listener, and the only
    # /relay-ish path on :8800 is a 501 signpost (POST /api/v1/servers/{id}/relay).
    port: 8802

# Ingress for hub HTTP endpoints (admin UI + REST API)
# NOTE: the relay WebSocket worker (:8802) is a SEPARATE listener and is
# intentionally NOT routed here — an HTTP ingress cannot path-route a bare
# WS listener. Expose service.relay.port via LoadBalancer/NodePort (or a
# TCP route) and point servers' hub_wss_url at ws(s)://<host>:8802.
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Long timeouts for any WebSocket upgrades served on the HTTP port
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
  hosts:
    - host: hub.phlix.local
      paths:
        # Server-claims API + all hub HTTP routes live on the :8800 router
        - path: /api
          pathType: Prefix
        - path: /
          pathType: Prefix
  tls:
    - secretName: phlix-hub-tls
      hosts:
        - hub.phlix.local

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    # Hub is mostly I/O-bound; modest defaults
    cpu: 250m
    memory: 512Mi

persistence:
  # Hub is largely stateless (relies on the database), but provides a small PVC for logs
  enabled: true
  logs:
    enabled: false
    storageClass: ""
    size: 2Gi

mysql:
  # Disabled by default — hub usually points at a shared / external MySQL
  enabled: false
  auth:
    database: phlix_hub
    username: phlix_hub
  primary:
    persistence:
      size: 10Gi

config:
  # MySQL host for hub data (server claims, enrollment tokens, audit log)
  database_host: ""
  database_port: 3306
  database_name: phlix_hub
  database_user: phlix_hub
  # Database password — required
  database_password: ""
  # JWT signing secret used to mint server enrollment tokens — required
  secret_key: ""
  # Logger verbosity
  log_level: info
  # Public-facing URL of this hub (used in enrollment QR codes etc.)
  public_url: ""

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

serviceAccount:
  create: true
  annotations: {}
  name: ""

env: []

nodeSelector: {}
tolerations: []
affinity: {}

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 30

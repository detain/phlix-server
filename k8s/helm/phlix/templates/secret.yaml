apiVersion: v1
kind: Secret
metadata:
  name: {{ include "phlix.fullname" . }}
  labels:
    {{- include "phlix.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-password: {{ include "phlix.rejectKnownPlaceholder" (list "config.database_password" (required "config.database_password is required" .Values.config.database_password)) | quote }}
  secret-key: {{ include "phlix.rejectKnownPlaceholder" (list "config.secret_key" (required "config.secret_key is required" .Values.config.secret_key)) | quote }}
  {{- /* M29: a VENDORED MySQL subchart's auth passwords ride the same
    refusal — they are what config.database_password must match, so guard both
    halves. INERT as shipped: Chart.yaml declares no dependencies and
    mysql.enabled defaults false (2026-11-03 review server__devops, Critical). */ -}}
  {{- if .Values.mysql.enabled }}
  {{- $_ := include "phlix.rejectKnownPlaceholder" (list "mysql.auth.password" .Values.mysql.auth.password) }}
  {{- $_ = include "phlix.rejectKnownPlaceholder" (list "mysql.auth.rootPassword" .Values.mysql.auth.rootPassword) }}
  {{- end }}
  {{- /* R18 (task 8): hub-enrollment-jwt key removed with its zero-reader
    PHLIX_HUB_ENROLLMENT_JWT consumer in deployment.yaml (see note there). */ -}}

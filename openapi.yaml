components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        HS256 access JWT minted by `AuthController::login`/`refresh` (iss=phlix, 1h).
        Enforced by `AuthMiddleware`; `AdminMiddleware` additionally requires an admin account.
  responses:
    Unauthorized:
      description: "No credentials, or credentials the middleware rejected."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "Authenticated but not permitted (non-admin, rating or schedule gate)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "No route matched, or the addressed resource does not exist."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: "The request body or query was missing or invalid."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: "Rate limit exceeded for this limiter profile."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      description: "The server's flat error envelope."
      required: ["error"]
      properties:
        error:
          type: string
          description: "Human-readable error message."
        code:
          type: string
          description: "Machine-readable dotted error code (e.g. auth.not_admin)."

  # S73: person-photo bytes from S72's flat `people-{tmdbPersonId}` artwork cache.
  # Registered OUTSIDE the auth group (route-level middleware []), but gated
  # handler-side by ArtworkByteResponder::rejectUnlessSigned (session user OR a
  # valid signed-URL) — so `[]` is not proof of ungated (S272): a missing/invalid
  # `w` width yields 400 BEFORE auth, an unauthenticated request yields 401, a
  # variant miss yields 404, a conditional-GET hit yields 304, and success is the
  # image/jpeg (or image/png for the logo width) byte stream. Mirrors
  # tests/Unit/Server/WebPortal/WebPortalRouterWirePathGuardTest MANIFEST.
  "/api/v1/people/{personId}/photo":
    get:
      operationId: "get_api_v1_people_person_photo"
      tags: ["Media"]
      summary: "Get person photo"
      description: "Get person photo (get /api/v1/people/{personId}/photo)."
      x-phlix-middleware: []
      parameters:
        - name: "personId"
          in: path
          required: true
          description: "TMDB person id — the flat artwork cache key suffix S72 writes."
          schema:
            type: string
      security: []
      responses:
        "200":
          description: "Success. Streams the person-photo image (image/jpeg, or image/png for the logo width)."
          content:
            '*/*':
              schema: {}
        "304":
          description: "Not Modified — conditional GET matching the resource validators."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

# phlix-server OpenAPI description (S65).
#
# ⚠ THIS FILE IS HAND-MAINTAINED AND MACHINE-CHECKED.
#
# `paths` must be an EXACT bijection with the composed route registry the
# server actually serves — the routes `Application` registers PLUS the routes
# the container-composed `WebPortalRouter` registers, with `Application` winning
# any method+path both routers expose (HttpHandler dispatches `Application` first
# and only falls through to `WebPortalRouter` on its 404). That is enforced by
# tests/Unit/Server/Contracts/OpenapiSpecCurrencyTest.php, which drives the REAL
# production container, recomposes both routers, and fails on any tuple present in
# one artefact and not the other, or on any middleware-chain mismatch. Adding,
# moving or re-gating a route therefore requires editing this file in the same
# commit. This file is never regenerated in CI — a self-adjusting spec cannot go
# red, which is exactly the S204 defect this guard exists to prevent.
#
# Machine-checked extension:
#   x-phlix-middleware  the route-level middleware chain, in order, by class
#                       short name. `[]` means no route-level middleware is
#                       registered — NOT proof a handler is ungated (a controller
#                       may gate as its first statement; see the S272 note in
#                       ApplicationRouterWirePathGuardTest).
#
# info.version is intentionally pinned to Phlix\Common\Version::STRING by
# OpenapiSpecCurrencyTest — a release bump that leaves the contract version stale
# turns the suite red rather than drifting silently (the whole point of this file).
#
# SPEC_TOKEN: CS65OPENAPISPECX9G
openapi: 3.1.0
info:
  title: "Phlix Media Server API"
  version: "1.2.3"
  summary: "REST surface of the Phlix media server"
  description: |-
    The HTTP API a Phlix server exposes: library and media browsing, playback
    sessions and progress, authentication (password, WebAuthn, OAuth providers,
    account linking), profiles and parental controls, casting (Chromecast, AirPlay,
    Roku, DLNA), Live TV, SyncPlay, transcoding/HLS/DASH, music/books/photos, plugins,
    webhooks, backup, the OPDS catalog, and the full `/api/v1/admin/*` control plane.
  license:
    name: "MIT"
    identifier: "MIT"
  contact:
    name: "Phlix"
servers:
  - url: "http://localhost:8096"
    description: |-
      The plain-HTTP address the Workerman HTTP worker `start.php` binds directly
      (the only served entry). The daemon itself terminates no TLS; this entry is
      the local/unproxied form.
  - url: "https://{host}"
    description: |-
      Production form of the identical surface: reached over HTTPS through the
      deployment's TLS-terminating reverse proxy. Always prefer this scheme for
      real traffic — the JWT bearer credential below is only safe over TLS.
    variables:
      host:
        default: "phlix.example.com"
        description: "The deployment's HTTPS hostname."
tags:
  - name: "Administration"
    description: "Operator control-plane routes under /api/v1/admin/* (settings, users, plugins, maintenance, backups, webhooks)."
  - name: "Authentication"
    description: "Sign-in, token refresh, logout, and WebAuthn / OAuth provider flows."
  - name: "Casting"
    description: "Chromecast, AirPlay, Roku and DLNA device discovery and control."
  - name: "Collections"
    description: "User playlists and custom collections."
  - name: "General"
    description: "Cross-cutting routes that fit no single domain (search, health, misc utilities)."
  - name: "Integrations"
    description: "Third-party metadata and service integrations (Trakt and similar)."
  - name: "Libraries"
    description: "Media library CRUD and scanning."
  - name: "Live TV"
    description: "Live TV tuners, the channel guide and recording."
  - name: "Media"
    description: "Media item browsing, metadata, posters and playback info."
  - name: "Music & Books"
    description: "Music, audiobook and e-book library endpoints."
  - name: "OPDS Catalog"
    description: "OPDS catalog feeds for e-readers."
  - name: "Photos"
    description: "Photo library and album endpoints."
  - name: "Profiles"
    description: "User profiles and parental-control settings."
  - name: "Sessions"
    description: "Device sessions and playback / continue-watching state."
  - name: "SyncPlay"
    description: "Watch-together SyncPlay group and time-sync endpoints."
  - name: "System"
    description: "Server-level system and status endpoints."
  - name: "Theming"
    description: "Appearance and theme endpoints."
  - name: "Transcoding"
    description: "HLS/DASH transcode job control and ABR ladder endpoints."
  - name: "Users"
    description: "Account and profile-scoped user data (favorites, ratings, watch history)."

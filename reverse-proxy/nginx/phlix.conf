# The HTTP worker serves on the RESOLVED bind, default 0.0.0.0:8096 (since
# R14-06 env PHLIX_HTTP_HOST/PHLIX_HTTP_PORT > server.host/server.port >
# shipped default, via src/Server/Runtime/ListenEndpoints.php; the upstream
# below assumes the shipped default, reachable on loopback). The WebSocket
# SyncPlay worker is a SEPARATE plaintext listener on its own resolved
# default, :8097 — it is NOT reachable through this upstream (the HTTP
# worker has zero WebSocket-upgrade logic); see the "WebSocket worker
# (:8097)" note below for how to expose it.
upstream phlix_backend {
    server 127.0.0.1:8096;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=stream_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

server {
    listen 80;
    server_name phlix.example.com;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name phlix.example.com;

    ssl_certificate /etc/letsencrypt/live/phlix.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phlix.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/phlix.example.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml application/xml;
    gzip_min_length 256;

    client_max_body_size 100M;

    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_connect_timeout 60s;
    proxy_buffering off;

    proxy_buffer_size 128k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 256k;

    limit_req zone=api_limit burst=20 nodelay;
    limit_conn addr 50;

    # ─── Static assets: served by the UPSTREAM, not here ───
    #
    # An earlier revision of this template carried a
    # `location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$` block with
    # `expires 1y` / `add_header Cache-Control "public, immutable"` and NO proxy_pass, root
    # or try_files — and this server block defines no root anywhere, so every match resolved
    # against nginx's compiled-in default html root, where the files never exist on the
    # proxy host. Behind install-nginx.sh that 404ed every hashed SPA chunk
    # (/assets/app/assets/index-<hash>.js|css|woff2) and every legacy public/assets static:
    # the shell booted, the assets died, the web client never rendered. `nginx -t` stayed
    # green because a dead location is still valid syntax; tests/Unit/Deploy/
    # NginxAssetLocationTest.php now pins the shape.
    #
    # The caching intent is satisfied upstream, scoped correctly: the :8096 worker's
    # HttpHandler::serveStatic() (src/Server/Workerman/HttpHandler.php) serves all of
    # public/** by jailed realpath and tags ONLY paths resolving under /assets/app/** with
    # `Cache-Control: public, max-age=31536000, immutable`. Everything below that comment —
    # location / — proxies these URLs to that worker, and the upstream headers pass through
    # unchanged. Do NOT re-add a global extension regex: it outranks the /media/ and /api/
    # prefix locations and would pin hashless server-generated images to a year of
    # `immutable` (the same reason the Caddy sibling never had one).

    # HLS/DASH segment + manifest locations keep `Access-Control-Allow-Origin *`
    # deliberately: media segment URLs are handed to playback surfaces that
    # fetch them cross-origin from embedded players (smart-TV apps, external
    # HLS testers, cast receivers), carry no credentials, and are already
    # gated by the server's signed-URL layer. This wildcard is scoped to
    # these public-media patterns ONLY — see the "NO CORS on /api/" note below.
    location ~ \.m3u8$ {
        proxy_pass http://phlix_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Range, Content-Type, Authorization";

        proxy_cache off;
        expires -1;
    }

    location ~ \.ts$ {
        proxy_pass http://phlix_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";

        proxy_buffering off;
        expires 1y;
    }

    location ~ \.mpd$ {
        proxy_pass http://phlix_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }

    # ─── WebSocket worker (:8097) — NOT proxied through this server block ───
    #
    # The SyncPlay WebSocket server is a separate plaintext TCP listener on
    # the RESOLVED bind, default 0.0.0.0:8097 (a dedicated Workerman
    # `websocket://` worker, count = 1 by law — one authoritative
    # SyncPlayManager; the bind moves via PHLIX_WS_HOST/PHLIX_WS_PORT or
    # websocket.host/port + restart, never a code edit). The HTTP worker
    # behind phlix_backend (:8096) has ZERO
    # WebSocket-upgrade logic, so there is deliberately no `location /ws` here:
    # proxying a path to :8096 would accept the TCP connection, then answer the
    # Upgrade handshake with a plain HTTP response and every client would fail
    # to upgrade. An earlier revision of this template shipped exactly that
    # fiction.
    #
    # To expose :8097 today, route it as its own TCP service, not as an HTTP
    # path on this vhost:
    #
    #   1. Simplest: publish port 8097 directly (firewall/LB TCP forward to
    #      this host's 127.0.0.1:8097 or 0.0.0.0:8097) and point WS clients at
    #      ws://<host>:8097/ . Keep long idle/read timeouts on any intermediary
    #      — WS connections are long-lived; 24h matches deploy/haproxy.cfg.
    #   2. TLS: terminate at a TCP/TLS proxy that forwards to 127.0.0.1:8097
    #      (nginx `stream` server block, HAProxy TCP frontend — see
    #      deploy/haproxy.cfg, or a dedicated Caddy `:8443` site). Path routing
    #      does not apply: the worker speaks the WS handshake at any path and
    #      carries auth in the ?token= query parameter.
    #
    # FUTURE: a same-origin wss:// path (upgrade proxied through this vhost on
    # to :8097) is being designed alongside a client-side wsUrl seam; when it
    # lands this comment block will be replaced with the real location. Until
    # then, do NOT re-add a /ws location pointing at phlix_backend — it cannot
    # work against :8096.

    location /media/ {
        proxy_pass http://phlix_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Limit range requests: a single byte-range per request is sufficient
        # for HLS/DASH progressive playback and keeps spool size predictable.
        max_ranges 1;

        proxy_buffer_size 1M;
        proxy_buffers 4 1M;
        # nginx requires busy_buffers >= max(buffer_size, one buffers slot) at
        # every level that raises them; without this 1M the inherited 256k made
        # the whole config unloadable ([emerg] at nginx -t).
        proxy_busy_buffers_size 2M;

        # Stream large client uploads (backup imports, manual pushes) straight
        # to the backend instead of buffering them through nginx, which would
        # otherwise spool the entire request body to a temp file before the
        # first byte is forwarded and break uploads larger than client_body_buffer_size.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /api/ {
        proxy_pass http://phlix_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # NO CORS on /api/ by design. The web SPA is served same-origin from
        # this vhost (/app on :8096) and the native clients (Roku, Tizen,
        # mobile, Windows) send Bearer tokens from non-browser runtimes that
        # never enforce CORS — a wildcard here only widens the attack surface:
        # any website could issue credentialed-looking cross-origin requests.
        # If you host the web client on a DIFFERENT origin, set explicit
        # origins instead of a wildcard, e.g.:
        #
        #   add_header Access-Control-Allow-Origin "https://app.example.com" always;
        #   add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        #   add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        #
        # and answer preflight for that origin only:
        #
        #   if ($request_method = 'OPTIONS') {
        #       add_header Access-Control-Allow-Origin "https://app.example.com";
        #       add_header Access-Control-Max-Age 86400;
        #       return 204;
        #   }
    }

    location /health {
        proxy_pass http://phlix_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://phlix_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny direct access to source/config paths. `^/+` collapses leading
    # double slashes (which would otherwise bypass `^/foo/`), and the trailing
    # `(/|$)` ensures the match is bounded to exact path segments.
    location ~ ^/+(\.env|config|vendor|src|tests|migrations)(/|$) {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/phlix-access.log;
    error_log /var/log/nginx/phlix-error.log;
}
